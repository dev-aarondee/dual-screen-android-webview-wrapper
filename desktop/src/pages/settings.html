<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Screen URLs</title>
<link rel="stylesheet" href="dialog.css">
</head>
<body>
<main>
  <h1>Screen URLs</h1>
  <form id="form">
    <label for="main">Cashier screen URL (main_url)</label>
    <input id="main" type="text" spellcheck="false" autocomplete="off">
    <label for="customer">Customer screen URL (customer_url)</label>
    <input id="customer" type="text" spellcheck="false" autocomplete="off" placeholder="Blank = the cashier's store second screen">
    <p class="muted" id="now"></p>
    <p class="muted" id="displays"></p>
    <label class="check"><input id="startup" type="checkbox"> Open Ultra POS when this computer starts</label>
    <label class="check"><input id="fullscreen" type="checkbox"> Cashier screen fills the whole monitor</label>
    <div class="buttons">
      <button type="button" id="quit" class="danger">Quit Ultra POS</button>
      <span class="grow"></span>
      <button type="button" id="cancel">Cancel</button>
      <button type="button" id="reload">Reload</button>
      <button type="submit" class="primary">Save &amp; reload</button>
    </div>
  </form>
</main>
<script src="settings-page.js"></script>
</body>
</html>
