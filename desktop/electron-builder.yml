# Builds UltraPOS-Setup-<version>.exe: a one-click installer that adds
# "Ultra POS" to the Start menu and the desktop, then opens the app.
appId: com.pos.ultrapos.desktop
productName: Ultra POS
directories:
  output: release
files:
  - src/**
  - assets/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  artifactName: UltraPOS-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ultra POS
  runAfterFinish: true
mac:
  target: dir
  icon: assets/icon.png
